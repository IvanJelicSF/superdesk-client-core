# Serves the built client and proxies the API/websocket to the superdesk-core
# containers. `proxy_set_header Host $host` is essential: with multi-tenancy
# the Host header is what selects the tenant (tenant-a.localhost, ...).

server {
    listen 80 default_server;
    server_name _;

    # re-resolve the backend container names through docker's embedded DNS —
    # nginx otherwise caches the IPs from startup and answers 502 after the
    # core containers are recreated. proxy_pass must use variables for the
    # resolver to apply (with a variable the original URI is passed through).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://server:5000;
    set $ws_backend http://ws:5100;

    client_max_body_size 200M;

    root /opt/superdesk/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # never cache the runtime config (its content is replaced after the build,
    # so the fingerprinted name no longer guarantees immutability)
    location ~ ^/config(\.[0-9a-f]+)?\.js$ {
        add_header Cache-Control "no-store";
    }

    location /api {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # multi-tenancy endpoints live at the server root, OUTSIDE /api:
    # /tenant-admin/* (admin host control plane), /accounts/me/tenants
    # (tenant switcher), /exchange/partners and /archive/send_to_tenant
    # (content exchange). Host preservation is what authorizes them —
    # rewriting it makes the server answer 404 by design.
    location /tenant-admin {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /accounts {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /exchange {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /archive/send_to_tenant {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /ws {
        proxy_pass $ws_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
